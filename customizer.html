<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yalekhyatha Creator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600;700&display=swap');
:root{--bg:#070707;--panel:#101010;--line:#292929;--gold:#d7ad52;--gold2:#f2d68e;--text:#f5f2ea;--muted:#999}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:DM Sans,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:380px 1fr}.controls{padding:28px;background:#0a0a0a;border-right:1px solid #222;overflow:auto}.brand{font-weight:700;letter-spacing:3px}.brand span{color:var(--gold)}.sub{color:var(--muted);font-size:12px;line-height:1.6;margin:8px 0 28px}.group{margin:0 0 20px}label{display:block;color:var(--gold);font-size:10px;font-weight:700;letter-spacing:2px;margin-bottom:8px}input,textarea{width:100%;padding:12px;border:1px solid #303030;border-radius:8px;background:#111;color:#eee;outline:0}textarea{min-height:75px;resize:vertical}input:focus,textarea:focus{border-color:var(--gold)}.upload{border:1px dashed #555;border-radius:9px;padding:16px;text-align:center;color:#aaa;cursor:pointer}.upload input{display:none}.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.theme{padding:10px 5px;border:1px solid #303030;background:#111;color:#aaa;border-radius:7px;font-size:10px}.theme.active{border-color:var(--gold);color:var(--gold2)}.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.thumb{height:75px;position:relative}.thumb img{width:100%;height:100%;object-fit:cover;border-radius:6px}.thumb button{position:absolute;right:3px;top:3px;border:0;border-radius:50%;background:#000d;color:#fff;width:22px;height:22px}.primary,.secondary{width:100%;padding:14px;border-radius:8px;font-weight:700;cursor:pointer}.primary{border:0;background:var(--gold);color:#090909}.secondary{margin-top:8px;border:1px solid #333;background:#111;color:#ddd}.actions{margin-top:25px}.workspace{padding:28px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h1{font:600 30px 'Playfair Display',serif}.mode button{border:1px solid #333;background:#111;color:#aaa;padding:8px 11px;border-radius:7px}.mode .active{border-color:var(--gold);color:var(--gold)}.shell{max-width:1100px;margin:auto;border:1px solid #252525;border-radius:15px;overflow:hidden}.preview{min-height:720px;padding:0 7% 60px;background:radial-gradient(circle at 75% 20%,#251e0c,#090909 38%,#070707 72%)}.nav{height:72px;border-bottom:1px solid #222;display:flex;align-items:center;font-size:13px;font-weight:700;letter-spacing:2px}.nav span{color:var(--gold)}.hero{padding:80px 0 60px}.avatar{width:86px;height:86px;border-radius:50%;object-fit:cover;border:1px solid var(--gold);display:none;margin-bottom:22px}.hero h2{font:600 clamp(48px,8vw,90px)/.93 'Playfair Display',serif;margin:0;letter-spacing:-3px}.hero h2 span,.galleryTitle span{color:var(--gold)}.tag{color:#aaa;max-width:560px;line-height:1.8}.socials{display:flex;gap:8px;flex-wrap:wrap}.socials a{background:var(--gold);color:#090909;padding:11px 16px;text-decoration:none;font-size:11px;font-weight:700}.galleryTitle{font:500 48px 'Playfair Display',serif}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.gallery img{width:100%;height:190px;object-fit:cover}.empty{grid-column:1/-1;border:1px dashed #333;padding:50px;text-align:center;color:#666}@media(max-width:850px){.app{grid-template-columns:1fr}.controls{border-right:0;border-bottom:1px solid #222}.gallery{grid-template-columns:1fr 1fr}}@media(max-width:560px){.gallery{grid-template-columns:1fr}.gallery img{height:250px}.workspace{padding:15px}}
</style></head>
<body><div class="app"><aside class="controls"><div class="brand">JENY<span>YALEKHYATHA</span></div><p class="sub">Create a personalized Yalekhyatha page and watch the preview update instantly.</p>
<div class="group"><label>YOUR NAME</label><input id="name" value="JENY YALEKHYATHA"></div>
<div class="group"><label>TAGLINE</label><textarea id="tagline">Welcome to my Yalekhyatha.</textarea></div>
<div class="group"><label>PROFILE PHOTO</label><label class="upload">Upload Profile Photo<input id="profile" type="file" accept="image/*"></label></div>
<div class="group"><label>THEME</label><div class="themes"><button class="theme active" data-c="gold">GOLD</button><button class="theme" data-c="blue">BLUE</button><button class="theme" data-c="red">RED</button></div></div>
<<div class="group"><label>THEME</label>
<label>SOCIAL LINKS</label>

<input id="instagram" placeholder="@instagram">
<input id="facebook" placeholder="Facebook username">
<input id="tiktok" placeholder="@tiktok">

</div>

<div class="group">
<label>GALLERY PHOTOS</label>
<label class="upload">
Add Photos
<input id="photos" type="file" accept="image/*" multiple>
</label>
<div class="group"><label>GALLERY PHOTOS</label><label class="upload">Add Photos<input id="photos" type="file" accept="image/*" multiple></label><div class="thumbs" id="thumbs"></div></div>
<div class="actions"><button class="primary" id="create">CREATE MY YALEKHYATHA</button><button class="secondary" id="reset">RESET</button></div></aside>
<main class="workspace"><div class="top"><h1>Live Preview</h1><div class="mode"><button id="desk" class="active">Desktop</button> <button id="phone">Mobile</button></div></div><div class="shell" id="shell"><div class="preview" id="preview"><div class="nav" id="nav">JENY <span>YALEKHYATHA</span></div><section class="hero"><img id="avatar" class="avatar"><h2 id="title">JENY<br><span>YALEKHYATHA.</span></h2><p class="tag" id="tag">Welcome to my Yalekhyatha.</p><div class="socials" id="socials"></div></section><h3 class="galleryTitle">My <span>Gallery</span></h3><div class="gallery" id="gallery"><div class="empty">Your gallery photos will appear here.</div></div></div></div></main></div>
<script>
const $=id=>document.getElementById(id);let profile='',photos=[],accent='#d7ad52',light='#f2d68e';
function fileData(f,cb){const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)}
function render(){document.documentElement.style.setProperty('--gold',accent);document.documentElement.style.setProperty('--gold2',light);let n=($('name').value||'YOUR NAME').trim().split(/\s+/),first=n.shift()||'YOUR',last=n.join(' ')||'YALEKHYATHA';$('title').innerHTML=first+'<br><span>'+last+'.</span>';$('nav').innerHTML=first+' <span>'+last+'</span>';$('tag').textContent=$('tagline').value||'Welcome to my Yalekhyatha.';if(profile){$('avatar').src=profile;$('avatar').style.display='block'}else $('avatar').style.display='none';let links=[];[['instagram','Instagram'],['facebook','Facebook'],['tiktok','TikTok']].forEach(x=>{if($(x[0]).value.trim())links.push('<a href="#">'+x[1]+'</a>')});$('socials').innerHTML=links.join('');$('gallery').innerHTML=photos.length?photos.map(p=>'<img src="'+p+'">').join(''):'<div class="empty">Your gallery photos will appear here.</div>';$('thumbs').innerHTML=photos.map((p,i)=>'<div class="thumb"><img src="'+p+'"><button onclick="del('+i+')">×</button></div>').join('')}
window.del=i=>{photos.splice(i,1);render()};['name','tagline','instagram','facebook','tiktok'].forEach(id=>$(id).addEventListener('input',render));$('profile').onchange=e=>{if(e.target.files[0])fileData(e.target.files[0],d=>{profile=d;render()})};$('photos').onchange=e=>{[...e.target.files].forEach(f=>fileData(f,d=>{photos.push(d);render()}));e.target.value=''};document.querySelectorAll('.theme').forEach(b=>b.onclick=()=>{document.querySelectorAll('.theme').forEach(x=>x.classList.remove('active'));b.classList.add('active');let c=b.dataset.c;accent=c==='blue'?'#65aef5':c==='red'?'#d85b5b':'#d7ad52';light=c==='blue'?'#a8d4ff':c==='red'?'#ff9b9b':'#f2d68e';render()});$('phone').onclick=()=>{$('shell').style.maxWidth='390px';$('phone').classList.add('active');$('desk').classList.remove('active')};$('desk').onclick=()=>{$('shell').style.maxWidth='1100px';$('desk').classList.add('active');$('phone').classList.remove('active')};$('reset').onclick=()=>{location.reload()};$('create').onclick=()=>{let name=$('name').value||'Yalekhyatha',html='<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+name+'</title><style>body{margin:0;background:#070707;color:#f5f2ea;font-family:Arial,sans-serif}main{min-height:100vh;padding:0 8% 60px;background:radial-gradient(circle at 75% 20%,#251e0c,#090909 40%,#070707 75%)}nav{height:75px;border-bottom:1px solid #222;display:flex;align-items:center;font-weight:700;letter-spacing:2px}nav span,h1 span,h2 span{color:'+accent+'}.hero{padding:85px 0 65px}h1{font:600 clamp(50px,9vw,105px)/.93 Georgia,serif;letter-spacing:-3px}p{color:#aaa;line-height:1.8;max-width:600px}.socials{display:flex;gap:8px}.socials a{background:'+accent+';color:#080808;padding:12px 17px;text-decoration:none;font-weight:700;font-size:12px}.avatar{width:90px;height:90px;border-radius:50%;object-fit:cover;border:1px solid '+accent+'}h2{font:500 55px Georgia,serif}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.gallery img{width:100%;height:250px;object-fit:cover}@media(max-width:700px){.gallery{grid-template-columns:1fr}.gallery img{height:300px}}</style></head><body><main><nav>'+name+'</nav><section class="hero">'+(profile?'<img class="avatar" src="'+profile+'">':'')+'<h1>'+name.replace(/\s+/,'<br><span>')+'</span></h1><p>'+($('tagline').value||'Welcome to my Yalekhyatha.')+'</p><div class="socials">'+$('socials').innerHTML+'</div></section><h2>My <span>Gallery</span></h2><div class="gallery">'+photos.map(p=>'<img src="'+p+'">').join('')+'</div></main></body></html>';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.html';a.click()};render();
</script></body></html>
