<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yalekhyatha Customizer</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #080808;
    color: #f5f2ea;
    font-family: "DM Sans", sans-serif;
}

.app {
    display: grid;
    grid-template-columns: 380px 1fr;
    min-height: 100vh;
}

/* =========================
   CUSTOMIZER
========================= */

.controls {
    background: #101010;
    border-right: 1px solid #292929;
    padding: 35px;
    overflow-y: auto;
}

.logo {
    font-weight: 700;
    letter-spacing: 3px;
    margin-bottom: 35px;
}

.logo span {
    color: #d7ad52;
    font-weight: 400;
}

h1 {
    font: 500 36px "Playfair Display", serif;
    margin-bottom: 10px;
}

.subtitle {
    color: #888;
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 30px;
}

label {
    display: block;
    color: #d7ad52;
    font-size: 10px;
    letter-spacing: 2px;
    margin-bottom: 8px;
    margin-top: 22px;
}

input,
select {
    width: 100%;
    padding: 13px;
    background: #080808;
    border: 1px solid #292929;
    color: white;
    border-radius: 6px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #d7ad52;
}

.upload {
    display: block;
    border: 1px dashed #444;
    padding: 15px;
    text-align: center;
    color: #999;
    cursor: pointer;
    border-radius: 6px;
    transition: .2s;
}

.upload:hover {
    border-color: #d7ad52;
    color: #d7ad52;
}

input[type="file"] {
    display: none;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: 0;
    background: #d7ad52;
    color: #080808;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 5px;
    transition: .2s;
}

button:hover {
    background: #f2d68e;
    transform: translateY(-2px);
}

/* =========================
   PREVIEW
========================= */

.preview-area {
    padding: 35px;
    background: #050505;
}

.preview-label {
    color: #666;
    font-size: 10px;
    letter-spacing: 3px;
    margin-bottom: 15px;
}

.preview {
    min-height: calc(100vh - 100px);
    border: 1px solid #222;
    border-radius: 10px;
    overflow: hidden;
    background: #080808;
}

.preview-hero {
    min-height: 420px;
    padding: 70px 8%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background:
        linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.8)),
        radial-gradient(circle at 70% 30%, #241d0d, #080808 65%);
}

.profile {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #d7ad52;
    margin-bottom: 25px;
    display: none;
}

.preview-hero h2 {
    font: 500 clamp(45px,6vw,80px)/.95 "Playfair Display", serif;
}

.preview-hero h2 span {
    color: #d7ad52;
}

.preview-hero p {
    color: #999;
    margin: 25px 0;
}

.socials {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.socials a {
    padding: 11px 17px;
    background: #d7ad52;
    color: #080808;
    text-decoration: none;
    font-size: 11px;
    font-weight: 700;
}

.gallery {
    padding: 50px 8%;
}

.gallery h3 {
    font: 500 38px "Playfair Display", serif;
    margin-bottom: 25px;
}

.photos {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 12px;
}

.photos img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 4px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:850px) {

    .app {
        grid-template-columns: 1fr;
    }

    .controls {
        border-right: 0;
        border-bottom: 1px solid #292929;
    }

    .preview-area {
        padding: 15px;
    }

    .preview {
        min-height: 600px;
    }

    .photos {
        grid-template-columns: 1fr 1fr;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- =========================
     CONTROLS
========================= -->

<section class="controls">

    <div class="logo">
        JENY<span>YALEKHYATHA</span>
    </div>

    <h1>Create Your Yalekhyatha</h1>

    <p class="subtitle">
        Customize your own personal Yalekhyatha page
        and see the changes instantly.
    </p>

    <label>YOUR NAME</label>
    <input
        id="nameInput"
        type="text"
        placeholder="Your Name"
        value="JENY YALEKHYATHA"
    >

    <label>TAGLINE</label>
    <input
        id="taglineInput"
        type="text"
        placeholder="Your tagline"
        value="Welcome to my Yalekhyatha."
    >

    <label>PROFILE PHOTO</label>

    <label class="upload">
        Upload Profile Photo
        <input
            id="profileInput"
            type="file"
            accept="image/*"
        >
    </label>

    <label>THEME</label>

    <select id="themeInput">
        <option value="gold">Black & Gold</option>
        <option value="blue">Black & Blue</option>
        <option value="red">Black & Red</option>
        <option value="purple">Black & Purple</option>
        <option value="green">Black & Green</option>
    </select>

    <label>INSTAGRAM</label>
    <input
        id="instagramInput"
        type="text"
        placeholder="@username"
    >

    <label>FACEBOOK</label>
    <input
        id="facebookInput"
        type="text"
        placeholder="Facebook username"
    >

    <label>TIKTOK</label>
    <input
        id="tiktokInput"
        type="text"
        placeholder="@username"
    >

    <label>GALLERY PHOTOS</label>

    <label class="upload">
        Upload Photos
        <input
            id="galleryInput"
            type="file"
            accept="image/*"
            multiple
        >
    </label>

    <button onclick="downloadPage()">
        CREATE MY YALEKHATHA
    </button>

</section>


<!-- =========================
     PREVIEW
========================= -->

<section class="preview-area">

    <div class="preview-label">
        LIVE PREVIEW
    </div>

    <div class="preview">

        <div class="preview-hero">

            <img
                id="profilePreview"
                class="profile"
                src=""
                alt=""
            >

            <h2 id="namePreview">
                JENY <span>YALEKHATHA.</span>
            </h2>

            <p id="taglinePreview">
                Welcome to my Yalekhyatha.
            </p>

            <div class="socials" id="socialPreview"></div>

        </div>

        <div class="gallery">

            <h3>My Gallery</h3>

            <div
                class="photos"
                id="galleryPreview"
            ></div>

        </div>

    </div>

</section>

</div>


<script>

const nameInput =
    document.getElementById("nameInput");

const taglineInput =
    document.getElementById("taglineInput");

const themeInput =
    document.getElementById("themeInput");

const instagramInput =
    document.getElementById("instagramInput");

const facebookInput =
    document.getElementById("facebookInput");

const tiktokInput =
    document.getElementById("tiktokInput");

const profileInput =
    document.getElementById("profileInput");

const galleryInput =
    document.getElementById("galleryInput");

const namePreview =
    document.getElementById("namePreview");

const taglinePreview =
    document.getElementById("taglinePreview");

const socialPreview =
    document.getElementById("socialPreview");

const profilePreview =
    document.getElementById("profilePreview");

const galleryPreview =
    document.getElementById("galleryPreview");


/* =========================
   LIVE TEXT
========================= */

nameInput.addEventListener("input", updatePreview);
taglineInput.addEventListener("input", updatePreview);
instagramInput.addEventListener("input", updatePreview);
facebookInput.addEventListener("input", updatePreview);
tiktokInput.addEventListener("input", updatePreview);
themeInput.addEventListener("change", updatePreview);


function updatePreview() {

    const name =
        nameInput.value || "YOUR NAME";

    const words =
        name.trim().split(" ");

    if (words.length > 1) {

        const first =
            words.slice(0,-1).join(" ");

        const last =
            words[words.length - 1];

        namePreview.innerHTML =
            first + " <span>" +
            last +
            ".</span>";

    } else {

        namePreview.innerHTML =
            name + "<span>.</span>";
    }

    taglinePreview.textContent =
        taglineInput.value;

    updateSocials();

    updateTheme();
}


/* =========================
   SOCIAL LINKS
========================= */

function updateSocials() {

    socialPreview.innerHTML = "";

    if (instagramInput.value) {

        socialPreview.innerHTML +=
            `<a href="#">
                Instagram
            </a>`;
    }

    if (facebookInput.value) {

        socialPreview.innerHTML +=
            `<a href="#">
                Facebook
            </a>`;
    }

    if (tiktokInput.value) {

        socialPreview.innerHTML +=
            `<a href="#">
                TikTok
            </a>`;
    }
}


/* =========================
   PROFILE IMAGE
========================= */

profileInput.addEventListener("change", function() {

    const file = this.files[0];

    if (!file) return;

    const reader =
        new FileReader();

    reader.onload = function(e) {

        profilePreview.src =
            e.target.result;

        profilePreview.style.display =
            "block";
    };

    reader.readAsDataURL(file);

});


/* =========================
   GALLERY
========================= */

galleryInput.addEventListener("change", function() {

    galleryPreview.innerHTML = "";

    const files =
        Array.from(this.files);

    files.forEach(file => {

        const reader =
            new FileReader();

        reader.onload = function(e) {

            const img =
                document.createElement("img");

            img.src =
                e.target.result;

            galleryPreview.appendChild(img);
        };

        reader.readAsDataURL(file);

    });

});


/* =========================
   THEMES
========================= */

function updateTheme() {

    const theme =
        themeInput.value;

    let color = "#d7ad52";

    if (theme === "blue")
        color = "#5ab7ff";

    if (theme === "red")
        color = "#ff5555";

    if (theme === "purple")
        color = "#b66cff";

    if (theme === "green")
        color = "#64c77b";

    document.documentElement.style
        .setProperty("--theme", color);

    document.querySelectorAll(
        ".preview-hero h2 span, .preview-hero .socials a"
    ).forEach(el => {

        if (el.tagName === "SPAN")
            el.style.color = color;

        else
            el.style.background = color;

    });

    profilePreview.style.borderColor =
        color;
}


/* =========================
   DOWNLOAD
========================= */

function downloadPage() {

    const name =
        nameInput.value || "My Yalekhyatha";

    const html = `
<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>${name}</title>

<style>

body {
    margin:0;
    background:#080808;
    color:#f5f2ea;
    font-family:Arial,sans-serif;
}

.hero {
    min-height:70vh;
    padding:10%;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

h1 {
    font-size:70px;
}

span {
    color:#d7ad52;
}

.gallery {
    padding:10%;
}

img {
    max-width:100%;
}

</style>

</head>

<body>

<section class="hero">

<h1>
${name}
</h1>

<p>
${taglineInput.value}
</p>

</section>

<section class="gallery">

<h2>
My Gallery
</h2>

</section>

</body>

</html>
`;

    const blob =
        new Blob(
            [html],
            {type:"text/html"}
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "my-yalekhyatha.html";

    a.click();

    URL.revokeObjectURL(url);
}


/* INITIAL */

updatePreview();

</script>

</body>
</html>
